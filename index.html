<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<link rel="manifest" href="/PLAYSTORE/manifest.json">
<title>snippet — pocket code workspace</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0a0c10; --panel:#10141c; --panel2:#0d1017; --panel3:#141a24;
    --border:rgba(255,255,255,.08);
    --text:#e7eaf1; --dim:#dbe1ec; --muted:#7d8697;
    --accent:#57f3b2; --ink:#04291c; --warn:#f3c657; --danger:#ff8a8a;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:'Space Grotesk',system-ui,-apple-system,sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; overscroll-behavior:none; }
  body{ background:var(--bg); color:var(--text); font-family:var(--sans); overflow:hidden; }
  .mono{ font-family:var(--mono); }
  button{ font-family:inherit; cursor:pointer; border:0; background:none; color:inherit; }
  svg{ display:block; }

  #app{ position:fixed; top:0; left:0; right:0; bottom:0; height:100%; height:100dvh;
    display:flex; flex-direction:column; z-index:1; }

  /* ───── header ───── */
  #hdr{ display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 14px 12px; border-bottom:1px solid var(--border);
    background:rgba(13,16,23,.92); }
  .hleft{ display:flex; align-items:center; gap:9px; min-width:0; }
  .logo{ width:34px; height:34px; border-radius:11px; flex:none; display:grid; place-items:center;
    color:var(--accent); background:rgba(87,243,178,.1); border:1px solid rgba(87,243,178,.3); }
  .htitle{ margin:0; font-size:14.5px; font-weight:700; line-height:1; }
  .hsub{ margin:4px 0 0; font-size:9px; text-transform:uppercase; color:var(--muted); letter-spacing:.2em; line-height:1; }
  .cursor{ color:var(--accent); animation:blink 1.1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0 } }
  .hacts{ display:flex; align-items:center; gap:7px; flex:none; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border-radius:11px; font-weight:600; font-size:13px; height:36px; padding:0 12px;
    transition:transform .12s, background .2s, border-color .2s, opacity .2s; }
  .btn:active{ transform:scale(.93); }
  .btn svg{ width:16px; height:16px; }
  .btn-primary{ background:var(--accent); color:var(--ink); box-shadow:0 4px 18px -6px rgba(87,243,178,.5); }
  .btn-ghost{ background:rgba(255,255,255,.05); border:1px solid var(--border); color:#c7cdda; }
  .btn-icon{ width:36px; padding:0; }
  .btn-txt{ display:none; }
  @media(min-width:560px){ .btn-txt{ display:inline; } }

  /* ───── filename bar ───── */
  #meta{ padding:11px 14px; border-bottom:1px solid var(--border); background:rgba(10,12,16,.6); }
  .mrow{ display:flex; align-items:center; justify-content:space-between; margin:0 2px 6px; gap:10px; }
  .mlabel{ font-size:9px; text-transform:uppercase; color:var(--muted); letter-spacing:.2em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--mono); }
  .save-state{ display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:9px;
    text-transform:uppercase; color:var(--muted); letter-spacing:.12em; flex:none; }
  .dot{ width:6px; height:6px; border-radius:99px; display:inline-block; background:var(--accent); }
  .field{ display:flex; align-items:stretch; background:var(--panel2);
    border:1px solid var(--border); border-radius:13px; transition:border-color .2s, box-shadow .2s; }
  .field:focus-within{ border-color:rgba(87,243,178,.5); box-shadow:0 0 0 3px rgba(87,243,178,.1); }
  .ficon{ display:grid; place-items:center; padding:0 4px 0 11px; color:var(--muted); }
  .ficon svg{ width:16px; height:16px; }
  #filename{ flex:1; min-width:0; background:none; border:0; outline:none; color:var(--text);
    font-family:var(--mono); font-size:16px; padding:10px 6px; }
  .sep{ align-self:center; color:var(--muted); font-family:var(--mono); }
  .extwrap{ position:relative; display:flex; align-items:center; }
  #ext{ appearance:none; -webkit-appearance:none; background:none; border:0; outline:none;
    color:var(--accent); font-family:var(--mono); font-size:16px; font-weight:500; padding:10px 26px 10px 6px; }
  .chev{ position:absolute; right:8px; width:12px; height:12px; color:var(--muted); pointer-events:none; }
  @media(min-width:560px){ #filename,#ext{ font-size:15px; } }

  /* ───── editor ───── */
  #editor{ position:relative; flex:1 1 0; min-height:0; background:rgba(10,12,16,.35); }
  .layer{ margin:0; border:0; font-family:var(--mono); font-size:15px; line-height:26px;
    letter-spacing:0; tab-size:2; padding:12px 16px 40vh 52px; white-space:pre; text-align:left; }
  #hl-wrap{ position:absolute; top:0; left:0; right:0; bottom:0; overflow:hidden; z-index:1;
    color:var(--dim); pointer-events:none; opacity:0; }
  #hl-code{ display:block; min-height:100%; font-family:inherit; }
  /* default: plain VISIBLE textarea (works even if JS/CDN fail) */
  #code{ position:absolute; top:0; left:0; right:0; bottom:0; z-index:2; display:block;
    resize:none; outline:none; appearance:none; -webkit-appearance:none; background:transparent;
    overflow:auto; color:var(--dim); -webkit-text-fill-color:var(--dim); caret-color:var(--accent); }
  #code::placeholder{ color:#566072; -webkit-text-fill-color:#566072; }
  /* upgraded overlay mode (set by JS after verified render) */
  #editor.on #hl-wrap{ opacity:1; }
  #editor.on #code{ color:transparent; -webkit-text-fill-color:transparent; }
  #gutter{ position:absolute; left:0; top:0; bottom:0; width:48px; z-index:3; overflow:hidden;
    pointer-events:none; border-right:1px solid rgba(255,255,255,.05);
    background:linear-gradient(to right, rgba(10,12,16,.95), rgba(10,12,16,.6)); }
  #gutter-inner{ padding:12px 10px 40vh 0; font-family:var(--mono); font-size:12px; line-height:26px;
    color:#3e4655; text-align:right; user-select:none; }
  #code::-webkit-scrollbar{ width:9px; height:9px; }
  #code::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12); border-radius:9px; border:2px solid var(--bg); }

  /* ───── status bar ───── */
  #statusbar{ display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:7px 14px calc(env(safe-area-inset-bottom,0px) + 7px);
    font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.09em;
    color:var(--muted); border-top:1px solid var(--border); background:rgba(13,16,23,.95); }
  #stat-meta{ flex:1; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #stat-fs{ display:flex; align-items:center; gap:5px; flex:none; }
  #stat-pos{ flex:none; }

  /* ───── explorer drawer ───── */
  #scrim{ position:fixed; inset:0; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.6);
    z-index:40; opacity:0; pointer-events:none; transition:opacity .25s; backdrop-filter:blur(2px); }
  #scrim.show{ opacity:1; pointer-events:auto; }
  #drawer{ position:fixed; top:0; left:0; bottom:0; width:86%; max-width:340px; z-index:41;
    background:var(--panel); border-right:1px solid var(--border);
    transform:translateX(-102%); transition:transform .28s cubic-bezier(.3,.9,.3,1);
    display:flex; flex-direction:column; box-shadow:18px 0 50px -20px rgba(0,0,0,.9); }
  #drawer.show{ transform:translateX(0); }
  .dhead{ display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:16px 14px 12px; border-bottom:1px solid var(--border); }
  .dtitle{ font-size:10px; text-transform:uppercase; letter-spacing:.2em; color:var(--muted); font-family:var(--mono); }
  .dtools{ display:flex; gap:6px; padding:10px 12px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .tool{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
    padding:7px 9px; border-radius:9px; background:rgba(255,255,255,.05);
    border:1px solid var(--border); color:#c7cdda; transition:transform .12s, border-color .2s; }
  .tool:active{ transform:scale(.94); }
  .tool svg{ width:13px; height:13px; }
  #tree{ flex:1; overflow-y:auto; overscroll-behavior:contain; padding:8px 6px 30px;
    -webkit-overflow-scrolling:touch; }
  .row{ display:flex; align-items:center; gap:6px; padding:7px 6px; border-radius:9px;
    font-size:13.5px; font-family:var(--mono); color:#c3cad8; user-select:none; }
  .row:active{ background:rgba(255,255,255,.05); }
  .row.sel{ background:rgba(87,243,178,.12); color:var(--accent); }
  .row .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .caret{ width:14px; flex:none; text-align:center; color:var(--muted); font-size:10px; transition:transform .18s; }
  .caret.open{ transform:rotate(90deg); }
  .ricon{ width:15px; height:15px; flex:none; color:var(--muted); }
  .row.sel .ricon{ color:var(--accent); }
  .kebab{ flex:none; width:24px; height:24px; border-radius:7px; display:grid; place-items:center;
    color:var(--muted); font-size:15px; line-height:1; }
  .kebab:active{ background:rgba(255,255,255,.1); }
  .empty{ padding:22px 14px; text-align:center; color:var(--muted); font-size:12px; line-height:1.7; }
  .dfoot{ padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 12px); border-top:1px solid var(--border);
    font-family:var(--mono); font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.12em; }

  /* ───── sheet (modal) ───── */
  #sheet{ position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--panel3);
    border-top:1px solid var(--border); border-radius:20px 20px 0 0; padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);
    transform:translateY(105%); transition:transform .28s cubic-bezier(.3,.9,.3,1); box-shadow:0 -20px 50px -20px rgba(0,0,0,.9); }
  #sheet.show{ transform:translateY(0); }
  .sh-title{ font-size:14px; font-weight:700; margin:0 0 3px; }
  .sh-sub{ font-size:11px; color:var(--muted); margin:0 0 14px; font-family:var(--mono);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #sheet input{ width:100%; background:var(--panel2); border:1px solid var(--border); border-radius:12px;
    color:var(--text); font-family:var(--mono); font-size:16px; padding:12px; outline:none; }
  #sheet input:focus{ border-color:rgba(87,243,178,.5); }
  .sh-acts{ display:flex; gap:8px; margin-top:14px; }
  .sh-acts .btn{ flex:1; height:42px; }
  .sh-list{ display:flex; flex-direction:column; gap:6px; }
  .sh-item{ display:flex; align-items:center; gap:10px; padding:13px 12px; border-radius:12px;
    background:rgba(255,255,255,.04); font-size:14px; font-weight:600; text-align:left; width:100%; }
  .sh-item:active{ background:rgba(255,255,255,.09); }
  .sh-item svg{ width:17px; height:17px; color:var(--muted); flex:none; }
  .sh-item.danger{ color:var(--danger); }
  .sh-item.danger svg{ color:var(--danger); }

  /* ───── toast ───── */
  #toast{ position:fixed; left:50%; bottom:64px; transform:translate(-50%,16px); z-index:70;
    display:flex; align-items:center; gap:8px; background:#121822;
    border:1px solid rgba(87,243,178,.35); padding:9px 15px; border-radius:99px;
    font-family:var(--mono); font-size:12px; max-width:90vw; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; box-shadow:0 12px 34px -10px rgba(0,0,0,.8); }
  #toast.show{ opacity:1; transform:translate(-50%,0); }
  #toast.err{ border-color:rgba(255,138,138,.5); }
  #toast span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  ::selection{ background:rgba(87,243,178,.25); }

  /* ───── Prism theme ───── */
  .token.comment,.token.prolog,.token.doctype,.token.cdata{ color:#576175; font-style:italic; }
  .token.punctuation{ color:#7d8697; }
  .token.property,.token.tag,.token.constant,.token.symbol{ color:#e0a06a; }
  .token.boolean,.token.number{ color:#d8a06a; }
  .token.selector,.token.attr-name,.token.string,.token.char,.token.builtin,.token.inserted{ color:#9ece7e; }
  .token.operator,.token.entity,.token.url{ color:#6fc3df; background:none; }
  .token.atrule,.token.attr-value,.token.keyword{ color:#c792ea; }
  .token.function,.token.class-name{ color:#7cb8f0; }
  .token.regex,.token.important,.token.variable{ color:#e17a8a; }
  .token.deleted{ color:#e17a8a; }
</style>
</head>
<body>

<div id="app">
  <header id="hdr">
    <div class="hleft">
      <button class="logo" id="menu-btn" aria-label="Open file explorer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="17" height="17"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div>
        <h1 class="htitle mono">snippet<span class="cursor">_</span></h1>
        <p class="hsub" id="ws-label">workspace</p>
      </div>
    </div>
    <div class="hacts">
      <button id="new-btn" class="btn btn-ghost" aria-label="New file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15h6"/></svg>
        <span class="btn-txt">New</span>
      </button>
      <button id="save-btn" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
        <span class="btn-txt">Save</span>
      </button>
    </div>
  </header>

  <section id="meta">
    <div class="mrow">
      <span class="mlabel" id="path-label">/ untitled.js</span>
      <span class="save-state"><span class="dot" id="draft-dot"></span><span id="draft-txt">saved</span></span>
    </div>
    <div class="field">
      <span class="ficon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M10 13l-2 2 2 2M14 13l2 2-2 2"/></svg>
      </span>
      <input id="filename" type="text" placeholder="untitled" class="mono"
        autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <span class="sep">.</span>
      <div class="extwrap">
        <select id="ext" class="mono">
          <option value=".js">js</option><option value=".ts">ts</option>
          <option value=".sh">sh</option><option value=".py">py</option>
          <option value=".json">json</option><option value=".txt">txt</option>
          <option value=".html">html</option><option value=".css">css</option>
          <option value=".md">md</option>
        </select>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>
  </section>

  <main id="editor">
    <div id="gutter" aria-hidden="true"><div id="gutter-inner">1</div></div>
    <pre id="hl-wrap" class="layer" aria-hidden="true"><code id="hl-code"></code></pre>
    <textarea id="code" class="layer" placeholder="// start typing…"
      spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Code editor"></textarea>
  </main>

  <footer id="statusbar">
    <span id="stat-pos">Ln 1, Col 1</span>
    <span id="stat-meta">1 line · 0 B</span>
    <span id="stat-fs"></span>
  </footer>
</div>

<div id="scrim"></div>

<aside id="drawer">
  <div class="dhead">
    <span class="dtitle">Explorer</span>
    <button class="kebab" id="drawer-close" aria-label="Close">✕</button>
  </div>
  <div class="dtools">
    <button class="tool" id="t-newfile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15h6"/></svg>File</button>
    <button class="tool" id="t-newfolder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.5l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/><path d="M12 11v6M9 14h6"/></svg>Folder</button>
    <button class="tool" id="t-import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.5l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/></svg>Open</button>
    <button class="tool" id="t-export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>Export</button>
  </div>
  <div id="tree"></div>
  <div class="dfoot" id="ws-stats">0 files</div>

  <!-- mobile import fallback: folder picker (Android Chrome) + plain multi-file picker (iOS Safari) -->
  <input id="dir-input" type="file" multiple webkitdirectory directory mozdirectory
    style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px" tabindex="-1" aria-hidden="true">
  <input id="file-input" type="file" multiple
    style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px" tabindex="-1" aria-hidden="true">
</aside>

<div id="sheet"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script>
(function(){
  'use strict';

  var EXTS = {
    '.js':{lang:'javascript',mime:'text/javascript',desc:'JavaScript'},
    '.ts':{lang:'typescript',mime:'text/typescript',desc:'TypeScript'},
    '.sh':{lang:'bash',mime:'application/x-sh',desc:'Shell Script'},
    '.py':{lang:'python',mime:'text/x-python',desc:'Python'},
    '.json':{lang:'json',mime:'application/json',desc:'JSON'},
    '.txt':{lang:'none',mime:'text/plain',desc:'Plain Text'},
    '.html':{lang:'markup',mime:'text/html',desc:'HTML'},
    '.css':{lang:'css',mime:'text/css',desc:'CSS'},
    '.md':{lang:'markdown',mime:'text/markdown',desc:'Markdown'}
  };

  function $(id){ return document.getElementById(id); }
  var editorEl=$('editor'), code=$('code'), hlWrap=$('hl-wrap'), hlCode=$('hl-code'),
      gutterEl=$('gutter'), gutterInner=$('gutter-inner'),
      filenameEl=$('filename'), extEl=$('ext'), pathLabel=$('path-label'),
      statPos=$('stat-pos'), statMeta=$('stat-meta'), statFs=$('stat-fs'),
      treeEl=$('tree'), drawer=$('drawer'), scrim=$('scrim'), sheet=$('sheet'),
      toast=$('toast'), draftTxt=$('draft-txt'), wsStats=$('ws-stats');

  var HAS_FILE = typeof window.showSaveFilePicker === 'function';
  var HAS_DIR  = typeof window.showDirectoryPicker === 'function';

  if (window.Prism && Prism.plugins && Prism.plugins.autoloader){
    Prism.plugins.autoloader.languages_path='https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/';
  }

  /* ══ workspace model ══ */
  var LS='snippet.workspace.v2';
  var ws=null, activeId=null, dirHandle=null;

  function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
  function mkFolder(name){ return {id:uid(),type:'folder',name:name,open:true,children:[]}; }
  function mkFile(name,content){ return {id:uid(),type:'file',name:name,content:content||''}; }

  function defaultWs(){
    var root=mkFolder('workspace');
    var src=mkFolder('src');
    src.children.push(mkFile('app.js','// nested folders work — tap ☰ to browse\nfunction boot(){\n  console.log("snippet ready");\n}\n\nboot();\n'));
    var utils=mkFolder('utils');
    utils.children.push(mkFile('helpers.js','export const sum = (a, b) => a + b;\n'));
    src.children.push(utils);
    root.children.push(src);
    root.children.push(mkFile('README.md','# Workspace\n\n- Tap **☰** for the explorer\n- Create files & nested folders\n- **Export** writes the whole tree to a real folder\n'));
    return root;
  }

  /* tree helpers */
  function walk(node,fn,parent,depth){
    fn(node,parent,depth||0);
    if(node.children) for(var i=0;i<node.children.length;i++) walk(node.children[i],fn,node,(depth||0)+1);
  }
  function findNode(id){ var f=null; walk(ws,function(n){ if(n.id===id) f=n; }); return f; }
  function findParent(id){ var p=null; walk(ws,function(n,par){ if(n.id===id) p=par; }); return p; }
  function pathOf(id){
    var parts=[], cur=findNode(id);
    while(cur && cur.id!==ws.id){ parts.unshift(cur.name); var pr=findParent(cur.id); cur=pr; }
    return '/'+parts.join('/');
  }
  function countFiles(){ var c=0,f=0; walk(ws,function(n){ if(n.type==='file')c++; else f++; }); return {files:c,folders:f-1}; }
  function uniqueName(parent,name){
    var base=name, ext='', dot=name.lastIndexOf('.');
    if(dot>0){ base=name.slice(0,dot); ext=name.slice(dot); }
    var n=name, i=2;
    var taken=function(x){ return parent.children.some(function(c){ return c.name.toLowerCase()===x.toLowerCase(); }); };
    while(taken(n)){ n=base+'-'+i+ext; i++; }
    return n;
  }
  /* safe sanitizer — no control chars in source */
  function cleanName(s){
    var bad='\\/:*?"<>|', out='';
    s=String(s||'').trim();
    for(var i=0;i<s.length;i++){
      var ch=s[i];
      if(ch.charCodeAt(0)<32){ continue; }
      out += (bad.indexOf(ch)>=0) ? '-' : ch;
    }
    return out.replace(/\s+/g,'_');
  }
  function splitExt(name){
    var d=name.lastIndexOf('.');
    if(d>0) return {base:name.slice(0,d), ext:name.slice(d).toLowerCase()};
    return {base:name, ext:''};
  }
  function langFor(name){
    var e=splitExt(name).ext;
    return EXTS[e] ? EXTS[e].lang : 'none';
  }

  function persist(){
    try{ localStorage.setItem(LS, JSON.stringify({ws:ws,activeId:activeId})); }catch(e){}
  }
  function restore(){
    var d=null;
    try{ d=JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){}
    if(d && d.ws && d.ws.children){ ws=d.ws; activeId=d.activeId; }
    else { ws=defaultWs(); activeId=null; }
    if(!activeId || !findNode(activeId) || findNode(activeId).type!=='file'){
      var first=null; walk(ws,function(n){ if(!first && n.type==='file') first=n; });
      activeId=first?first.id:null;
    }
  }

  /* ══ tree rendering ══ */
  var ICON_FOLDER='<svg class="ricon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.5l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/></svg>';
  var ICON_FILE='<svg class="ricon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function renderTree(){
    var html='';
    function row(node,depth){
      var isF=node.type==='folder';
      var sel=(node.id===activeId)?' sel':'';
      var pad=8+depth*14;
      html+='<div class="row'+sel+'" data-id="'+node.id+'" style="padding-left:'+pad+'px">'+
        (isF?'<span class="caret'+(node.open?' open':'')+'">▶</span>':'<span class="caret"></span>')+
        (isF?ICON_FOLDER:ICON_FILE)+
        '<span class="nm">'+esc(node.name)+'</span>'+
        '<button class="kebab" data-menu="'+node.id+'" aria-label="Actions">⋯</button></div>';
      if(isF && node.open){
        var kids=node.children.slice().sort(function(a,b){
          if(a.type!==b.type) return a.type==='folder'?-1:1;
          return a.name.toLowerCase()<b.name.toLowerCase()?-1:1;
        });
        for(var i=0;i<kids.length;i++) row(kids[i],depth+1);
      }
    }
    var top=ws.children.slice().sort(function(a,b){
      if(a.type!==b.type) return a.type==='folder'?-1:1;
      return a.name.toLowerCase()<b.name.toLowerCase()?-1:1;
    });
    for(var i=0;i<top.length;i++) row(top[i],0);
    treeEl.innerHTML = html || '<div class="empty">No files yet.<br>Use <b>File</b> or <b>Folder</b> above.</div>';
    var c=countFiles();
    wsStats.textContent=c.files+' file'+(c.files===1?'':'s')+' · '+c.folders+' folder'+(c.folders===1?'':'s')+(dirHandle?' · linked':'');
  }

  treeEl.addEventListener('click', function(ev){
    var mb=ev.target.closest('[data-menu]');
    if(mb){ ev.stopPropagation(); openMenu(mb.getAttribute('data-menu')); return; }
    var r=ev.target.closest('.row'); if(!r) return;
    var node=findNode(r.getAttribute('data-id')); if(!node) return;
    if(node.type==='folder'){ node.open=!node.open; persist(); renderTree(); }
    else { openFile(node.id); closeDrawer(); }
  });

  /* ══ editor ══ */
  function activeFile(){ var n=activeId?findNode(activeId):null; return (n&&n.type==='file')?n:null; }

  function openFile(id){
    flush();
    activeId=id;
    var f=activeFile();
    if(f){
      code.value=f.content||'';
      var sp=splitExt(f.name);
      filenameEl.value=sp.base;
      extEl.value=EXTS[sp.ext]?sp.ext:'.txt';
    } else { code.value=''; filenameEl.value=''; }
    persist(); render(); renderTree(); updatePath();
  }

  function updatePath(){
    var f=activeFile();
    pathLabel.textContent=f?pathOf(f.id):'no file open';
  }

  function render(){
    var f=activeFile();
    var lang=f?langFor(f.name):(EXTS[extEl.value]?EXTS[extEl.value].lang:'none');
    var v=code.value, text=v+(v.slice(-1)==='\n'?' ':'');
    hlCode.className='language-'+lang;
    hlCode.textContent=text;
    if(lang!=='none' && window.Prism){
      try{ Prism.highlightElement(hlCode); }catch(e){ hlCode.textContent=text; }
    }
    if(!editorEl.classList.contains('on') && hlWrap.clientWidth>0 && hlWrap.clientHeight>0){
      editorEl.classList.add('on');
    }
    updateGutter(); updateStatus(); syncScroll();
  }

  function updateGutter(){
    var lines=code.value.split('\n').length;
    var s='';
    for(var i=1;i<=lines;i++) s+=i+'\n';
    gutterInner.textContent=s;
    var w=Math.max(48, String(lines).length*8.5+26);
    gutterEl.style.width=w+'px';
    code.style.paddingLeft=(w+6)+'px';
    hlWrap.style.paddingLeft=(w+6)+'px';
  }

  function updateStatus(){
    var i=code.selectionStart||0, before=code.value.slice(0,i);
    var ln=before.split('\n').length, col=i-before.lastIndexOf('\n');
    var lines=code.value.split('\n').length;
    var bytes=code.value.length;
    try{ bytes=new Blob([code.value]).size; }catch(e){}
    statPos.textContent='Ln '+ln+', Col '+col;
    statMeta.textContent=lines+' line'+(lines===1?'':'s')+' · '+bytes.toLocaleString()+' B';
  }

  function syncScroll(){
    hlWrap.scrollTop=code.scrollTop; hlWrap.scrollLeft=code.scrollLeft;
    gutterEl.scrollTop=code.scrollTop;
  }
  code.addEventListener('scroll', syncScroll);

  var flushTimer=null;
  function markDirty(){
    draftTxt.textContent='saving';
    clearTimeout(flushTimer);
    flushTimer=setTimeout(function(){ flush(); draftTxt.textContent='saved'; },350);
  }
  function flush(){
    var f=activeFile();
    if(f){ f.content=code.value; persist(); }
  }

  code.addEventListener('input', function(){ render(); markDirty(); });
  ['keyup','click','select','focus'].forEach(function(e){ code.addEventListener(e, updateStatus); });

  code.addEventListener('keydown', function(ev){
    if(ev.key==='Tab'){ ev.preventDefault(); insert('  '); }
    else if(ev.key==='Enter'){
      ev.preventDefault();
      var i=code.selectionStart, ls=code.value.lastIndexOf('\n',i-1)+1;
      var m=code.value.slice(ls,i).match(/^[ \t]*/);
      insert('\n'+(m?m[0]:''));
    }
    else if((ev.metaKey||ev.ctrlKey) && ev.key.toLowerCase()==='s'){ ev.preventDefault(); saveCurrent(); }
  });
  function insert(t){
    var s=code.selectionStart, e=code.selectionEnd;
    code.setRangeText(t,s,e,'end');
    render(); markDirty();
  }

  /* rename via filename bar */
  function applyName(){
    var f=activeFile(); if(!f) return;
    var base=cleanName(filenameEl.value)||'untitled';
    var p=findParent(f.id)||ws;
    var want=base+extEl.value;
    if(want.toLowerCase()!==f.name.toLowerCase()){
      f.name=uniqueName({children:p.children.filter(function(c){return c.id!==f.id;})},want);
    }
    persist(); renderTree(); updatePath(); render();
  }
  filenameEl.addEventListener('change', applyName);
  filenameEl.addEventListener('blur', applyName);
  extEl.addEventListener('change', applyName);

  /* ══ sheet / menus ══ */
  var sheetOpen=false;
  function showSheet(html){ sheet.innerHTML=html; sheet.classList.add('show'); scrim.classList.add('show'); sheetOpen=true; }
  function closeSheet(){ sheet.classList.remove('show'); sheetOpen=false; if(!drawer.classList.contains('show')) scrim.classList.remove('show'); }

  function askName(title,sub,val,cb){
    showSheet('<p class="sh-title">'+esc(title)+'</p><p class="sh-sub">'+esc(sub)+'</p>'+
      '<input id="sh-in" type="text" value="'+esc(val)+'" autocomplete="off" autocapitalize="off" spellcheck="false">'+
      '<div class="sh-acts"><button class="btn btn-ghost" id="sh-cancel">Cancel</button>'+
      '<button class="btn btn-primary" id="sh-ok">Confirm</button></div>');
    var inp=$('sh-in');
    setTimeout(function(){ inp.focus(); inp.select(); },120);
    $('sh-cancel').onclick=closeSheet;
    $('sh-ok').onclick=function(){ var v=inp.value; closeSheet(); cb(v); };
    inp.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); var v=inp.value; closeSheet(); cb(v); } };
  }

  function openMenu(id){
    var node=findNode(id); if(!node) return;
    var isF=node.type==='folder';
    var h='<p class="sh-title">'+esc(node.name)+'</p><p class="sh-sub">'+esc(pathOf(id))+'</p><div class="sh-list">';
    if(isF){
      h+='<button class="sh-item" data-a="nf">'+ICON_FILE+'New file here</button>';
      h+='<button class="sh-item" data-a="nd">'+ICON_FOLDER+'New folder here</button>';
    } else {
      h+='<button class="sh-item" data-a="open">'+ICON_FILE+'Open in editor</button>';
      h+='<button class="sh-item" data-a="dl">'+ICON_FILE+'Save to device</button>';
    }
    h+='<button class="sh-item" data-a="ren">'+ICON_FILE+'Rename</button>';
    h+='<button class="sh-item" data-a="dup">'+ICON_FILE+'Duplicate</button>';
    h+='<button class="sh-item danger" data-a="del">'+ICON_FILE+'Delete</button></div>';
    showSheet(h);
    sheet.querySelectorAll('[data-a]').forEach(function(b){
      b.onclick=function(){
        var a=b.getAttribute('data-a'); closeSheet();
        setTimeout(function(){ menuAction(a,id); },180);
      };
    });
  }

  function menuAction(a,id){
    var node=findNode(id); if(!node) return;
    var parent=findParent(id)||ws;
    if(a==='nf') newFileIn(node);
    else if(a==='nd') newFolderIn(node);
    else if(a==='open') { openFile(id); closeDrawer(); }
    else if(a==='dl') saveNodeToDisk(node);
    else if(a==='ren'){
      askName('Rename','Current: '+node.name,node.name,function(v){
        var nm=cleanName(v); if(!nm) return;
        node.name=uniqueName({children:parent.children.filter(function(c){return c.id!==id;})},nm);
        if(node.id===activeId){ var sp=splitExt(node.name); filenameEl.value=sp.base; if(EXTS[sp.ext]) extEl.value=sp.ext; }
        persist(); renderTree(); updatePath(); render(); toastMsg('Renamed to '+node.name);
      });
    }
    else if(a==='dup'){
      var copy=JSON.parse(JSON.stringify(node));
      walk(copy,function(n){ n.id=uid(); });
      copy.name=uniqueName(parent,node.name);
      parent.children.push(copy); persist(); renderTree(); toastMsg('Duplicated');
    }
    else if(a==='del'){
      showSheet('<p class="sh-title">Delete '+esc(node.name)+'?</p><p class="sh-sub">'+esc(pathOf(id))+
        (node.type==='folder'?' — folder and all contents':'')+'</p>'+
        '<div class="sh-acts"><button class="btn btn-ghost" id="sh-cancel">Keep</button>'+
        '<button class="btn btn-primary" id="sh-ok" style="background:var(--danger);color:#2b0505">Delete</button></div>');
      $('sh-cancel').onclick=closeSheet;
      $('sh-ok').onclick=function(){
        closeSheet();
        var idx=parent.children.indexOf(node);
        if(idx>=0) parent.children.splice(idx,1);
        if(activeId===id || !findNode(activeId)){
          var first=null; walk(ws,function(n){ if(!first && n.type==='file') first=n; });
          activeId=first?first.id:null; openFile(activeId);
        }
        persist(); renderTree(); updatePath(); toastMsg('Deleted');
      };
    }
  }

  function newFileIn(folder){
    askName('New file','in '+pathOf(folder.id),'untitled.js',function(v){
      var nm=cleanName(v); if(!nm) return;
      if(splitExt(nm).ext==='') nm+='.txt';
      var f=mkFile(uniqueName(folder,nm),'');
      folder.open=true; folder.children.push(f);
      persist(); openFile(f.id); renderTree(); toastMsg('Created '+f.name);
    });
  }
  function newFolderIn(folder){
    askName('New folder','in '+pathOf(folder.id),'new-folder',function(v){
      var nm=cleanName(v); if(!nm) return;
      var d=mkFolder(uniqueName(folder,nm));
      folder.open=true; folder.children.push(d);
      persist(); renderTree(); toastMsg('Folder created');
    });
  }

  /* ══ drawer ══ */
  function openDrawer(){ drawer.classList.add('show'); scrim.classList.add('show'); renderTree(); }
  function closeDrawer(){ drawer.classList.remove('show'); if(!sheetOpen) scrim.classList.remove('show'); }
  $('menu-btn').onclick=openDrawer;
  $('drawer-close').onclick=closeDrawer;
  scrim.onclick=function(){ if(sheetOpen) closeSheet(); else closeDrawer(); };
  $('t-newfile').onclick=function(){ newFileIn(ws); };
  $('t-newfolder').onclick=function(){ newFolderIn(ws); };
  $('new-btn').onclick=function(){ newFileIn(ws); };

  /* ══ toast ══ */
  var tTimer=null;
  function toastMsg(msg,err){
    clearTimeout(tTimer);
    toast.className=err?'err show':'show';
    toast.innerHTML='<span>'+esc(msg)+'</span>';
    tTimer=setTimeout(function(){ toast.classList.remove('show'); },2600);
  }

  /* ══ saving ══ */
  function saveCurrent(){ flush(); var f=activeFile(); if(f) saveNodeToDisk(f); else toastMsg('No file open',true); }

  function saveNodeToDisk(node){
    if(node.type==='folder'){ exportWorkspace(node); return; }
    var sp=splitExt(node.name), meta=EXTS[sp.ext]||EXTS['.txt'];
    if(HAS_FILE){
      var opts={ suggestedName:node.name };
      var acc={}; acc[meta.mime]=[sp.ext||'.txt'];
      opts.types=[{description:meta.desc,accept:acc}];
      window.showSaveFilePicker(opts).then(function(h){
        return h.createWritable().then(function(w){
          return w.write(node.content||'').then(function(){ return w.close(); });
        }).then(function(){ toastMsg('Saved '+h.name); });
      }).catch(function(e){
        if(e && e.name==='AbortError') return;
        blobDown(node.name,node.content||'');
      });
    } else blobDown(node.name,node.content||'');
  }

  function blobDown(name,content){
    try{
      var blob=new Blob([content],{type:'text/plain;charset=utf-8'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url; a.download=name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },4000);
      toastMsg('Downloading '+name);
    }catch(e){ toastMsg('Save failed',true); }
  }
  $('save-btn').onclick=saveCurrent;

  /* export whole tree → real folder, else ZIP */
  function exportWorkspace(rootNode){
    flush();
    var root=rootNode||ws;
    if(HAS_DIR){
      window.showDirectoryPicker({mode:'readwrite'}).then(function(dh){
        dirHandle=dh;
        return writeDir(dh,root).then(function(){
          toastMsg('Exported to /'+dh.name); renderTree();
        });
      }).catch(function(e){
        if(e && e.name==='AbortError') return;
        toastMsg('Export failed — zipping',true); zipDownload(root);
      });
    } else zipDownload(root);
  }

  function writeDir(dh,node){
    var jobs=node.children.map(function(ch){
      if(ch.type==='folder'){
        return dh.getDirectoryHandle(ch.name,{create:true}).then(function(sub){ return writeDir(sub,ch); });
      }
      return dh.getFileHandle(ch.name,{create:true}).then(function(fh){
        return fh.createWritable().then(function(w){
          return w.write(ch.content||'').then(function(){ return w.close(); });
        });
      });
    });
    return Promise.all(jobs);
  }

  /* import a real folder */
  function importFolder(){
    if(!HAS_DIR){ importViaInput(); return; }   /* mobile / unsupported → hidden <input type=file> */
    window.showDirectoryPicker().then(function(dh){
      dirHandle=dh;
      var root=mkFolder(dh.name||'workspace');
      return readDir(dh,root,0).then(function(){
        ws=root; activeId=null;
        var first=null; walk(ws,function(n){ if(!first && n.type==='file') first=n; });
        activeId=first?first.id:null;
        persist(); openFile(activeId); renderTree();
        toastMsg('Opened /'+root.name);
      });
    }).catch(function(e){ if(e && e.name!=='AbortError') toastMsg('Could not open folder',true); });
  }
  var SKIP={'node_modules':1,'.git':1,'dist':1,'build':1,'.next':1};
  function readDir(dh,node,depth){
    if(depth>5) return Promise.resolve();
    var jobs=[];
    return (function(){
      var it=dh.values(), out=[];
      function step(){
        return it.next().then(function(r){
          if(r.done) return out;
          out.push(r.value); return step();
        });
      }
      return step();
    })().then(function(entries){
      entries.forEach(function(h){
        if(h.kind==='directory'){
          if(SKIP[h.name]||h.name.charAt(0)==='.') return;
          var sub=mkFolder(h.name); node.children.push(sub);
          jobs.push(readDir(h,sub,depth+1));
        } else {
          var sp=splitExt(h.name);
          if(!EXTS[sp.ext] && ['.jsx','.tsx','.yml','.yaml','.env','.cfg','.ini','.xml','.svg','.log'].indexOf(sp.ext)<0) return;
          jobs.push(h.getFile().then(function(file){
            if(file.size>512*1024) return;
            return file.text().then(function(t){ node.children.push(mkFile(h.name,t)); });
          }).catch(function(){}));
        }
      });
      return Promise.all(jobs);
    });
  }
  /* ══ mobile fallback import: hidden <input type="file" webkitdirectory multiple> ══ */
  var dirInput=$('dir-input'), fileInput=$('file-input');
  var SUPPORTS_WEBKITDIR = ('webkitdirectory' in document.createElement('input'));
  var EXTRA_EXT=['.jsx','.tsx','.yml','.yaml','.env','.cfg','.ini','.xml','.svg','.log'];
  var MAX_BYTES=512*1024;

  function extAllowed(name){
    var sp=splitExt(name);
    return !!EXTS[sp.ext] || EXTRA_EXT.indexOf(sp.ext)>=0;
  }

  function importViaInput(){
    /* Android Chrome supports webkitdirectory → real folder picker.
       iOS Safari doesn't → same flow, but as a multi-file picker (Files app). */
    var input = SUPPORTS_WEBKITDIR ? dirInput : fileInput;
    try{ input.value=''; }catch(e){}
    input.click();
  }

  function readTextFile(f){
    if(f.text) return f.text();
    return new Promise(function(res,rej){
      var r=new FileReader();
      r.onload=function(){ res(String(r.result||'')); };
      r.onerror=function(){ rej(r.error); };
      r.readAsText(f);
    });
  }

  /* create/find nested folders for a path array, mirroring readDir's structure */
  function ensurePath(root,parts){
    var cur=root;
    for(var i=0;i<parts.length;i++){
      var seg=parts[i], next=null;
      for(var j=0;j<cur.children.length;j++){
        var c=cur.children[j];
        if(c.type==='folder' && c.name===seg){ next=c; break; }
      }
      if(!next){ next=mkFolder(seg); next.open=true; cur.children.push(next); }
      cur=next;
    }
    return cur;
  }

  function importFileList(fileList){
    var list=Array.prototype.slice.call(fileList||[]);
    if(!list.length) return;

    /* workspace name = top folder segment when the folder picker was used */
    var rootName='workspace';
    for(var i=0;i<list.length;i++){
      var rp=list[i].webkitRelativePath||'';
      if(rp.indexOf('/')>0){ rootName=rp.split('/')[0]; break; }
    }

    var root=mkFolder(rootName), jobs=[], skipped=0, imported=0;

    list.forEach(function(f){
      var rel=f.webkitRelativePath||f.name;
      var parts=rel.split('/').filter(Boolean);
      if(parts.length>1 && parts[0]===rootName) parts=parts.slice(1); /* drop the root segment */
      var fname=parts.pop();
      /* same skips as readDir: junk dirs, hidden dirs, depth cap, ext allowlist, size cap */
      var blocked=false;
      for(var k=0;k<parts.length;k++){
        if(SKIP[parts[k]] || parts[k].charAt(0)==='.'){ blocked=true; break; }
      }
      if(blocked || parts.length>5 || !extAllowed(fname) || f.size>MAX_BYTES){ skipped++; return; }

      jobs.push(readTextFile(f).then(function(text){
        var dir=ensurePath(root,parts);
        dir.children.push(mkFile(uniqueName(dir,fname),text));
        imported++;
      }).catch(function(){ skipped++; }));
    });

    if(!jobs.length){ toastMsg('No supported files found',true); return; }
    toastMsg('Importing '+jobs.length+' files…');

    Promise.all(jobs).then(function(){
      if(!imported){ toastMsg('No supported files found',true); return; }
      ws=root; activeId=null; dirHandle=null;   /* input path has no writable handle */
      var first=null; walk(ws,function(n){ if(!first && n.type==='file') first=n; });
      activeId=first?first.id:null;
      persist(); openFile(activeId); renderTree();
      toastMsg('Imported '+imported+' file'+(imported===1?'':'s')+(skipped?' · '+skipped+' skipped':''));
    });
  }

  dirInput.addEventListener('change', function(){ importFileList(this.files); });
  fileInput.addEventListener('change', function(){ importFileList(this.files); });

  $('t-import').onclick=importFolder;
  $('t-export').onclick=function(){ exportWorkspace(ws); };

  /* ══ minimal ZIP (store, no compression) for the fallback path ══ */
  var CRC=(function(){ var t=[],c,n,k;
    for(n=0;n<256;n++){ c=n; for(k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
  function crc32(u8){ var c=0xFFFFFFFF; for(var i=0;i<u8.length;i++) c=CRC[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }

  function zipDownload(root){
    var enc=new TextEncoder(), files=[];
    (function collect(node,prefix){
      node.children.forEach(function(ch){
        if(ch.type==='folder') collect(ch,prefix+ch.name+'/');
        else files.push({path:prefix+ch.name,data:enc.encode(ch.content||'')});
      });
    })(root,'');
    if(!files.length){ toastMsg('Nothing to export',true); return; }

    var parts=[], central=[], offset=0;
    files.forEach(function(f){
      var nameBytes=enc.encode(f.path), crc=crc32(f.data), sz=f.data.length;
      var lh=new Uint8Array(30+nameBytes.length), dv=new DataView(lh.buffer);
      dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true);
      dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0x21,true);
      dv.setUint32(14,crc,true); dv.setUint32(18,sz,true); dv.setUint32(22,sz,true);
      dv.setUint16(26,nameBytes.length,true); dv.setUint16(28,0,true);
      lh.set(nameBytes,30);
      parts.push(lh,f.data);

      var ch=new Uint8Array(46+nameBytes.length), cv=new DataView(ch.buffer);
      cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
      cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0x21,true);
      cv.setUint32(16,crc,true); cv.setUint32(20,sz,true); cv.setUint32(24,sz,true);
      cv.setUint16(28,nameBytes.length,true); cv.setUint32(42,offset,true);
      ch.set(nameBytes,46);
      central.push(ch);
      offset+=lh.length+f.data.length;
    });
    var cdSize=central.reduce(function(a,b){ return a+b.length; },0);
    var end=new Uint8Array(22), ev=new DataView(end.buffer);
    ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
    ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true);

    var blob=new Blob(parts.concat(central,[end]),{type:'application/zip'});
    var url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=(root.name||'workspace')+'.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },5000);
    toastMsg('Zipped '+files.length+' files');
  }

  /* ══ viewport fit ══ */
  var app=$('app');
  function fit(){
    var vv=window.visualViewport;
    app.style.height=(vv?vv.height:window.innerHeight)+'px';
    app.style.top=(vv?vv.offsetTop:0)+'px';
    syncScroll();
  }
  if(window.visualViewport){ visualViewport.addEventListener('resize',fit); visualViewport.addEventListener('scroll',fit); }
  window.addEventListener('resize',fit);

  /* ══ boot ══ */
  statFs.innerHTML = HAS_DIR ? '<span class="dot"></span>folders'
    : (HAS_FILE ? '<span class="dot"></span>native fs'
    : '<span class="dot" style="background:var(--warn)"></span>zip/download');
  restore();
  openFile(activeId);
  renderTree();
  fit();
  render();
})();
</script>
</body>
</html>
